# Vaultwarden on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=vaultwarden
PKG_TITLE="Vaultwarden"
PKG_DESC="Vaultwarden password manager (Bitwarden-compatible) in Container Manager, on HTTPS with DSM's certificate, with a DSM window for the admin token, users and 2FA lockouts, sign-ups, backups, mail, updates and a clean removal."
APP_ID="Vaultwarden.AppInstance"
REPO=tombruton87/vaultwarden-dsm
SERVICES="server proxy"
VOLUMES="data proxy"
IMAGE_VARS="VW_IMAGE PROXY_IMAGE"
PORT=8222
PORTS="8222 8223 8224 8322"
HEALTH_PATH=/alive
APP_ACTIONS="admintoken|signups|invites|invite|remove2fa|userdisable|userenable|userdelete|smtptest|hints|refreshcert"
APP_ANSWER_KEYS="SIGNUPS TLS"
APP_REQUEST_KEYS="EMAIL USER_UUID TLS"
TAGLINE="password manager"
WELCOME="Vaultwarden is a lightweight server for the Bitwarden apps and browser extensions: your own password manager, on your own Synology. Install it, open the address, create your account, then point the Bitwarden apps at it."
BACKUP_WHAT="the database (a consistent SQLite copy), attachments, sends, the RSA keys that sign sessions, and the admin page's settings."
SITE_NOTE="The Bitwarden apps, browser extensions and security keys only talk to Vaultwarden over <b>HTTPS</b>, so the package serves HTTPS itself: with DSM's own certificate (Control Panel → Security → Certificate, the system default — renewals are picked up daily), or a self-signed one made here. The web vault works with either after the browser's warning; the apps need a certificate they trust, such as one from Let's Encrypt in DSM. Or switch HTTPS off here and put Vaultwarden behind DSM's reverse proxy (steps below)."
ICON_TOP="#3b5068"
ICON_BOTTOM="#1c2836"
ICON_LETTER="V"   # only if icon.png is missing
BETA=yes
