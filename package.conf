# Vaultwarden on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=vaultwarden
PKG_TITLE="Vaultwarden"
PKG_DESC="Vaultwarden password manager (Bitwarden-compatible) in Container Manager, with a DSM window for the admin token, users and 2FA lockouts, sign-ups, backups, mail, updates and a clean removal."
APP_ID="Vaultwarden.AppInstance"
REPO=tombruton87/vaultwarden-dsm
SERVICES="server"
VOLUMES="data"
IMAGE_VARS="VW_IMAGE"
PORT=8222
PORTS="8222 8223 8224 8322"
HEALTH_PATH=/alive
APP_ACTIONS="admintoken|signups|invites|invite|remove2fa|userdisable|userenable|userdelete|smtptest|hints"
APP_ANSWER_KEYS="SIGNUPS"
APP_REQUEST_KEYS="EMAIL USER_UUID"
TAGLINE="password manager"
WELCOME="Vaultwarden is a lightweight server for the Bitwarden apps and browser extensions: your own password manager, on your own Synology. Install it, open the address, create your account, then point the Bitwarden apps at it."
BACKUP_WHAT="the database (a consistent SQLite copy), attachments, sends, the RSA keys that sign sessions, and the admin page's settings."
SITE_NOTE="The Bitwarden apps, browser extensions and WebAuthn keys need Vaultwarden on <b>HTTPS</b>. Put it behind DSM's reverse proxy (steps below) and set the address here to https://your.domain; over plain http on the LAN only the web vault works, and some features refuse."
ICON_TOP="#2d6cdf"
ICON_BOTTOM="#17408f"
ICON_LETTER="V"
BETA=yes
